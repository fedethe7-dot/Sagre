name: Scansiona siti eventi

on:
  schedule:
    - cron: '23 4 * * 1'   # ogni lunedì verso le 6 del mattino (ora italiana)
  workflow_dispatch:        # pulsante "Run workflow" per lanciarlo subito
  push:
    paths: ['fonti.txt']    # e ogni volta che aggiungi un sito

permissions:
  contents: write
  pages: write

concurrency:
  group: scansiona
  cancel-in-progress: false

jobs:
  scansiona:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepara il browser per i siti che caricano con JavaScript
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Cerca eventi sui siti di fonti.txt
        run: node scripts/scansiona.mjs
        env:
          DEBUG_DIR: debug
      - name: Salva i risultati
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- proposte.js; then echo "Nessuna novità"; exit 0; fi
          git config user.name "scanner-sagre"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposte.js
          git commit -m "Eventi trovati sui siti ($(date +%Y-%m-%d))"
          git push
          # aggiorna subito il sito pubblicato
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Pagine senza eventi (ramo debug-scanner, per controllo)
        if: always()
        run: |
          [ -d debug ] || exit 0
          mv debug /tmp/debug && cd /tmp/debug && git init -q && git checkout -q -b debug-scanner
          git config user.name "scanner-sagre"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "pagine vuote" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" debug-scanner
